openapi: 3.0.0
info:
  title: Ruggine Chat API
  version: 1.0.0
  description: API per la chat Ruggine

tags:
  - name: Auth
    description: Endpoint per autenticazione e registrazione
  - name: Groups
    description: Gestione gruppi
  - name: Group Invites
    description: Inviti per entrare nei gruppi
  - name: Group Messages
    description: Messaggi all’interno dei gruppi
  - name: Private Messages
    description: Messaggi privati tra utenti

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registra un nuovo utente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Utente creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Username già esistente

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login utente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Login riuscito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenziali non valide

  /groups:
    post:
      tags:
        - Groups
      summary: Crea un nuovo gruppo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Gruppo creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Token mancante o non valido

    get:
      tags:
        - Groups
      summary: Lista dei gruppi a cui l’utente appartiene
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista dei gruppi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Token mancante o non valido

  /groups/{group_id}/invite:
    post:
      tags:
        - Group Invites
      summary: Invia un invito a un utente per entrare nel gruppo
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invited_user_id
              properties:
                invited_user_id:
                  type: integer
      responses:
        '200':
          description: Invito inviato
        '401':
          description: Token non valido
        '403':
          description: Non autorizzato

    get:
      tags:
        - Group Invites
      summary: Ottieni tutti gli inviti ricevuti dall'utente
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista degli inviti
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: 
                      type: integer
                    group_id:
                      type: integer
        '401':
          description: Token non valido

    delete:
      tags:
        - Group Invites
      summary: Cancella un invito al gruppo
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
        - name: invited_user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invito cancellato con successo
        '401':
          description: Token non valido
        '403':
          description: Non autorizzato
        '404':
          description: Invito non trovato

  /groups/{group_id}/messages:
    get:
      tags:
        - Group Messages
      summary: Ottieni i messaggi di gruppo
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista dei messaggi del gruppo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMessage'
        '401':
          description: Token non valido
        '403':
          description: Non autorizzato

    post:
      tags:
        - Group Messages
      summary: Invia un messaggio al gruppo
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Messaggio inviato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMessage'
        '401':
          description: Token non valido
        '403':
          description: Utente non fa parte del gruppo

  /messages/private:
    post:
      tags:
        - Private Messages
      summary: Invia un messaggio privato
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiver_id
                - text
              properties:
                receiver_id:
                  type: integer
                text:
                  type: string
      responses:
        '201':
          description: Messaggio inviato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateMessage'
        '401':
          description: Token non valido
    get:
      tags:
        - Private Messages
      summary: Ottieni tutti i messaggi privati ricevuti dall’utente
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista dei messaggi privati ricevuti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivateMessage'
        '401':
          description: Token non valido

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: mario
        password:
          type: string
          example: securepassword123

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string

    GroupCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: amici-di-scacchi

    GroupResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    GroupMessage:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        sender_id:
          type: integer
        group_id:
          type: integer
        sent_at:
          type: string
          format: date-time

    PrivateMessage:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        sender_id:
          type: integer
        receiver_id:
          type: integer
        sent_at:
          type: string
          format: date-time